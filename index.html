<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>درب الزلق</title>
<meta name="description" content="أجمل المسلسلات في مكان واحد — مقاطع مختارة ولحظات لا تُنسى">
<meta name="theme-color" content="#1a100a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar" id="topbar">
  <nav class="nav nav-main" aria-label="القائمة الرئيسية">
    <a href="#/" data-route="home" class="nav-link"><span class="ic" data-i="home"></span>الرئيسية</a>
    <a href="#/series" data-route="series" class="nav-link">المسلسلات</a>
    <a href="#/clips" data-route="clips" class="nav-link">المقاطع</a>
    <a href="#/live" data-route="live" class="nav-link">المباشر<span class="live-dot" hidden></span></a>
    <a href="#/seasons" data-route="seasons" class="nav-link"><span class="ic" data-i="moon"></span><span class="seasons-label">مواسم رمضان</span></a>
  </nav>
  <a href="#/" class="brand" aria-label="الرئيسية"><img id="logo" src="logo.png" alt="الشعار"></a>
  <nav class="nav nav-tools" aria-label="أدوات">
    <button class="tool" id="btnSearch" aria-label="بحث"><span class="ic" data-i="search"></span></button>
    <a href="#/favs" data-route="favs" class="tool nav-link"><span class="ic" data-i="heart"></span><span class="t">مفضلتي</span></a>
    <a href="admin.html" class="tool admin-btn" title="لوحة التحكم"><span class="ic" data-i="grid"></span><span class="t">لوحة التحكم</span></a>
  </nav>
</header>

<aside class="rail" aria-label="القنوات">
  <div class="rail-head"><span class="ic" data-i="tv"></span>القنوات</div>
  <nav class="rail-list" id="railList"></nav>
</aside>

<main id="view" tabindex="-1"></main>

<footer class="foot">
  <img src="logo.png" alt="" class="foot-logo" id="footLogo">
  <p>جميع المقاطع معروضة عبر يوتيوب من قنواتها الأصلية</p>
</footer>

<nav class="tabbar" aria-label="تنقل سريع">
  <a href="#/" data-route="home"><span class="ic" data-i="home"></span>الرئيسية</a>
  <a href="#/channels" data-route="channels"><span class="ic" data-i="tv"></span>القنوات</a>
  <a href="#/live" data-route="live" class="tab-live"><span class="ic" data-i="live"></span>المباشر<span class="live-dot" hidden></span></a>
  <a href="#/series" data-route="series"><span class="ic" data-i="clapper"></span>المسلسلات</a>
  <a href="#/favs" data-route="favs"><span class="ic" data-i="heart"></span>مفضلتي</a>
</nav>

<div class="player" id="player" hidden role="dialog" aria-modal="true" aria-label="مشغل المقطع">
  <div class="player-backdrop" data-close></div>
  <div class="player-box">
    <button class="player-close" data-close aria-label="إغلاق"><span class="ic" data-i="close"></span></button>
    <div class="player-frame" id="playerFrame"></div>
    <div class="player-info">
      <div>
        <h2 id="playerTitle"></h2>
        <p id="playerMeta"></p>
      </div>
      <div class="player-actions">
        <button class="pill-btn" id="playerFav"></button>
        <button class="pill-btn" id="playerShare"><span class="ic" data-i="share"></span>مشاركة</button>
      </div>
    </div>
    <div class="player-more" id="playerMore"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
